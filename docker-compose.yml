version: "3.8"
services:
    db:
      image: 'mariadb:10'
      ports:
        - '${FORWARD_DB_PORT:-3306}:3306'
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        MYSQL_DATABASE: ${DB_DATABASE}
        MYSQL_USER: ${DB_USERNAME}
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      volumes:
        - db-data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
        retries: 3
        timeout: 5s
    redis:
      image: redis:6.0-alpine
      expose:
        - "6379"
    node:
      image: node:12-alpine
      working_dir: /app
      env_file: .env
      volumes:
        - ./:/app
      command: sh -c "npm install && npm run production"
      restart: "no"
    nginx:
        build:
          context: .
          dockerfile: ./docker/nginx.Dockerfile
        restart: always
        env_file: .env
        depends_on:
          - php
          - node
        expose:
          - 80
        environment:
          VIRTUAL_HOST: alpaca.local
        networks:
          - reverse-proxy
          - default
        #deploy:
        #    replicas: 1
        #    resources:
        #        limits:
        #            # cpus: "0.50"
        #            memory: 50M
        #        reservations:
        #            # cpus: "0.25"
        #            memory: 30M
        #    restart_policy:
        #        condition: any
        #        delay: 5s
        #        window: 120s
    composer:
      image: composer:2.1
      working_dir: /app
      environment:
        SSH_AUTH_SOCK: /ssh-auth.sock
      volumes:
        - ./:/app
        - "$SSH_AUTH_SOCK:/ssh-auth.sock"
        - /etc/passwd:/etc/passwd:ro
        - /etc/group:/etc/group:ro
      command: composer install --ignore-platform-reqs --no-scripts
    php:
      build:
        context: .
        dockerfile: ./docker/php.Dockerfile
      working_dir: /app
      env_file: .env
      restart: always
      depends_on:
        - composer
        - redis
        - db
      environment:
        VIRTUAL_HOST: alpaca.local
      expose:
          - "9000"
      #deploy:
      #    replicas: 1
      #    resources:
      #        limits:
      #            # cpus: "0.50"
      #            memory: 128M
      #        reservations:
      #            # cpus: "0.25"
      #            memory: 64M
      #    restart_policy:
      #        condition: any
      #        window: 120s
    supervisor:
      build:
        context: .
        dockerfile: ./docker/supervisord.Dockerfile
      container_name: supervisor
      image: redditsaved/laravel-supervisord:latest
      restart: unless-stopped
      depends_on:
        - composer
        - redis
        - db
      environment:
        - APP_ROOT=${APP_ROOT}
        - QUEUE_DRIVER=${QUEUE_CONNECTION}
        - OPTIONS=${QUEUE_OPTIONS}
        - NUM_PROCS=${NUM_PROCS}
      volumes:
        - ./:${APP_ROOT}
      networks:
        - reverse-proxy
        - default
networks:
  reverse-proxy:
    external: true
volumes:
  db-data:
