version: "3.8"
services:
    nginx:
        build:
          context: .
          dockerfile: ./docker/nginx.Dockerfile
        restart: always
        depends_on:
          - php
          - node
        ports:
          - "${APP_PORT:-80}:80"
        expose:
          - 80
        environment:
          VIRTUAL_HOST: ${VIRTUAL_HOST}
        networks:
          - reverse-proxy
          - default
        #deploy:
        #    replicas: 1
        #    resources:
        #        limits:
        #            # cpus: "0.50"
        #            memory: 50M
        #        reservations:
        #            # cpus: "0.25"
        #            memory: 30M
        #    restart_policy:
        #        condition: any
        #        delay: 5s
        #        window: 120s
    php:
      build:
        context: .
        dockerfile: ./docker/php.Dockerfile
      working_dir: /app
      env_file: .env
      restart: always
      expose:
          - "9000"
      #deploy:
      #    replicas: 1
      #    resources:
      #        limits:
      #            # cpus: "0.50"
      #            memory: 128M
      #        reservations:
      #            # cpus: "0.25"
      #            memory: 64M
      #    restart_policy:
      #        condition: any
      #        window: 120s
    supervisor:
      build:
        context: .
        dockerfile: ./docker/supervisord.Dockerfile
      container_name: supervisor
      image: redditsaved/laravel-supervisord:latest
      restart: unless-stopped
      depends_on:
        - composer
        - redis
        - db
      environment:
        - APP_ROOT=${APP_ROOT}
        - QUEUE_DRIVER=${QUEUE_CONNECTION}
        - OPTIONS=${QUEUE_OPTIONS}
        - NUM_PROCS=${NUM_PROCS}
      volumes:
        - ./:${APP_ROOT}
      networks:
        - reverse-proxy
        - default
networks:
  reverse-proxy:
    external: true
