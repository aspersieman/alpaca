version: "3.8"
services:
    lamoid.db:
      image: 'mariadb:10'
      ports:
        - '${FORWARD_DB_PORT:-3306}:3306'
      environment:
        MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        MYSQL_DATABASE: ${DB_DATABASE}
        MYSQL_USER: ${DB_USERNAME}
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      volumes:
        - db-data:/var/lib/mysql
        - "/etc/timezone:/etc/timezone:ro"
        - "/etc/localtime:/etc/localtime:ro"
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
        retries: 3
        timeout: 5s
    lamoid.redis:
      image: redis:6.0-alpine
      expose:
        - "6379"
    lamoid.node:
      image: node:12-alpine
      working_dir: /app
      env_file: .env
      volumes:
        - ./:/app
        - "/etc/timezone:/etc/timezone:ro"
        - "/etc/localtime:/etc/localtime:ro"
      command: sh -c "npm install && npm run production"
      restart: "no"
    lamoid.nginx:
      build:
        context: .
        dockerfile: ./docker/nginx.Dockerfile
      restart: always
      env_file: .env
      depends_on:
        - lamoid.php
        - lamoid.node
      expose:
        - "${EXPOSE_PORT}"
      environment:
        VIRTUAL_HOST: "${VIRTUAL_HOST}"
      networks:
        - reverse-proxy
        - default
      volumes:
        - ./public:/app/public:ro
    lamoid.composer:
      image: composer:2.1
      working_dir: /app
      environment:
        SSH_AUTH_SOCK: /ssh-auth.sock
      volumes:
        - ./:/app
        - "$SSH_AUTH_SOCK:/ssh-auth.sock"
        - /etc/passwd:/etc/passwd:ro
        - /etc/group:/etc/group:ro
      command: composer install --ignore-platform-reqs --no-scripts
    lamoid.php:
      build:
        context: .
        dockerfile: ./docker/php.Dockerfile
      working_dir: /app
      env_file: .env
      restart: always
      depends_on:
        - lamoid.composer
        - lamoid.redis
        - lamoid.db
      environment:
        VIRTUAL_HOST: "${VIRTUAL_HOST}"
      expose:
        - "9000"
      volumes:
        - ./:/app
        - "/etc/timezone:/etc/timezone:ro"
        - "/etc/localtime:/etc/localtime:ro"
    lamoid.supervisor:
      build:
        context: .
        dockerfile: ./docker/supervisord.Dockerfile
      container_name: lamoid.supervisor
      image: redditsaved/laravel-supervisord:latest
      restart: unless-stopped
      depends_on:
        - lamoid.composer
        - lamoid.redis
        - lamoid.db
      environment:
        - APP_ROOT=${APP_ROOT}
        - QUEUE_DRIVER=${QUEUE_CONNECTION}
        - OPTIONS=${QUEUE_OPTIONS}
        - NUM_PROCS=${NUM_PROCS}
      volumes:
        - ./:${APP_ROOT}
        - "/etc/timezone:/etc/timezone:ro"
        - "/etc/localtime:/etc/localtime:ro"
      networks:
        - reverse-proxy
        - default
networks:
  reverse-proxy:
    external: true
volumes:
  db-data:
