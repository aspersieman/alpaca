version: "3.8"
services:
    nginx:
        build:
          context: .
          dockerfile: ./docker/nginx.Dockerfile
        restart: always
        depends_on:
          - php
          - node
        ports:
          - "8080:80"
        expose:
          - 80
        environment:
          VIRTUAL_HOST: alpaca.local
        networks:
          - reverse-proxy
          - default
        deploy:
            replicas: 1
            resources:
                limits:
                    # cpus: "0.50"
                    memory: 50M
                reservations:
                    # cpus: "0.25"
                    memory: 30M
            restart_policy:
                condition: any
                delay: 5s
                window: 120s
    php:
      build:
        context: .
        dockerfile: ./docker/php.Dockerfile
      working_dir: /app
      env_file: .env
      restart: always
      expose:
          - "9000"
      deploy:
          replicas: 1
          resources:
              limits:
                  # cpus: "0.50"
                  memory: 128M
              reservations:
                  # cpus: "0.25"
                  memory: 64M
          restart_policy:
              condition: any
              window: 120s
networks:
  reverse-proxy:
    external: true
