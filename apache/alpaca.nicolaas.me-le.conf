<VirtualHost *:443>
    SSLEngine On
    SSLProxyEngine On
    ServerName lamoid.com:443
    ProxyPreserveHost On

    ProxyPass / http://0.0.0.0:8080/
    ProxyPassReverse / http://0.0.0.0:8080/

    RewriteEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/lamoid.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lamoid.com/privkey.pem
</VirtualHost>
# vim: syntax=apache
