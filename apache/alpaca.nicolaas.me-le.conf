<VirtualHost *:443>
    ServerName alpaca.nicolaas.me
    ProxyPreserveHost On

    ProxyPass alpaca.nicolaas.me http://0.0.0.0:8080/
    ProxyPassReverse alpaca.nicolaas.me http://0.0.0.0:8080/

    RewriteEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/alpaca.nicolaas.me/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/alpaca.nicolaas.me/privkey.pem
</VirtualHost>
# vim: syntax=apache
