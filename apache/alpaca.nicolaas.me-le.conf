<VirtualHost *:443>
    SSLEngine On
    SSLProxyEngine On
    ServerName alpaca.nicolaas.me:443
    ProxyPreserveHost On

    ProxyPass / http://0.0.0.0:8080/
    ProxyPassReverse / http://0.0.0.0:8080/

    RewriteEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/alpaca.nicolaas.me/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/alpaca.nicolaas.me/privkey.pem
</VirtualHost>
# vim: syntax=apache
