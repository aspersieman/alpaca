[supervisord]
nodaemon=true

[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:lamoid-schedule]
process_name=%(program_name)s_%(process_num)02d
;command=php /app/artisan schedule:work
command=/app/docker/schedule-work.sh
stdout_logfile=%(ENV_APP_ROOT)s/storage/logs/schedule.log
autostart=true
autorestart=true
numprocs=%(ENV_NUM_PROCS)s
redirect_stderr=true
stopwaitsecs=3600

[program:lamoid-horizon]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan horizon
stdout_logfile=%(ENV_APP_ROOT)s/storage/logs/horizon.log
autostart=true
autorestart=true
numprocs=%(ENV_NUM_PROCS)s
redirect_stderr=true
stopwaitsecs=3600
